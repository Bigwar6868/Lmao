[project]
name = "trading-algo"
version = "2.0.1"
description = "Self-evolving multi-asset trading algorithm with IC Markets integration"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
trade = "main:main"
backtest = "scripts.backtest:main"
paper-trade = "scripts.paper_trade:main"
scan = "scripts.scan:main"
auto-trade = "scripts.auto_trade:main"
telegram-bot = "scripts.telegram_bot:main"
evolve = "scripts.evolve:main"
