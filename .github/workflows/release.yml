name: Release

on:
  push:
    tags:
      - 'v*'
      - 'DEMO'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for the release (e.g. v1.0.0 or DEMO)'
        required: true
        default: 'DEMO'

permissions:
  contents: write

env:
  NODE_VERSION: '20'

jobs:
  # ── Build standalone binaries on each OS ──────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_target: node20-linux-x64
            asset_name: trading-algo-linux-amd64
            archive: tar.gz
          - os: ubuntu-latest
            pkg_target: node20-linux-arm64
            asset_name: trading-algo-linux-arm64
            archive: tar.gz
          - os: macos-latest
            pkg_target: node20-macos-x64
            asset_name: trading-algo-macos-amd64
            archive: tar.gz
          - os: macos-14
            pkg_target: node20-macos-arm64
            asset_name: trading-algo-macos-arm64
            archive: tar.gz
          - os: windows-latest
            pkg_target: node20-win-x64
            asset_name: trading-algo-windows-amd64
            archive: zip
            ext: .exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: trading-algo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: trading-algo/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Bundle with esbuild + copy pino externals
        run: node scripts/bundle.mjs

      - name: Compile binary with pkg
        run: |
          npx @yao-pkg/pkg dist/cli.cjs \
            --target ${{ matrix.pkg_target }} \
            --output dist/${{ matrix.asset_name }}${{ matrix.ext || '' }} \
            --compress GZip

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: cd dist && tar -czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.asset_name }}${{ matrix.ext || '' }}

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        run: cd dist && 7z a ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}${{ matrix.ext || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            trading-algo/dist/${{ matrix.asset_name }}.${{ matrix.archive }}
            trading-algo/dist/${{ matrix.asset_name }}${{ matrix.ext || '' }}

  # ── Collect all builds and create release ─────────────────
  release:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ steps.tag.outputs.tag }} — Multi-Agent Trading System"
          body: |
            ## Download & Run — No Install Required

            Node.js is **bundled in** — just download, extract, and run. No dependencies needed.

            | Platform | Download | Run |
            |----------|----------|-----|
            | **macOS (Apple Silicon)** | `trading-algo-macos-arm64.tar.gz` | `./trading-algo-macos-arm64 backtest` |
            | **macOS (Intel)** | `trading-algo-macos-amd64.tar.gz` | `./trading-algo-macos-amd64 backtest` |
            | **Linux (x64)** | `trading-algo-linux-amd64.tar.gz` | `./trading-algo-linux-amd64 backtest` |
            | **Linux (ARM64)** | `trading-algo-linux-arm64.tar.gz` | `./trading-algo-linux-arm64 backtest` |
            | **Windows (x64)** | `trading-algo-windows-amd64.zip` | `trading-algo-windows-amd64.exe backtest` |

            ### Quick Start
            ```bash
            # macOS / Linux — download, extract, run
            tar -xzf trading-algo-*.tar.gz
            ./trading-algo-* help

            # Windows — extract zip, then double-click or:
            trading-algo-windows-amd64.exe help
            ```

            ### Commands
            ```
            auto-trade    Run 24/7 autonomous trading (all agents)
            backtest      Backtest all strategies
            paper-trade   Run a paper trading cycle
            analyze       Market analysis
            evolve        Evolve strategy parameters
            diagnose      System diagnostics
            scan          Scan for opportunities
            seed-data     Seed cache with market data
            ```

            ### What's Inside
            - **109 assets** — 35 crypto, 54 stocks, 20 forex
            - **8 autonomous agents** that debate trades before execution
            - **Genetic algorithm** self-evolution (strategy DNA mutation)
            - **Walk-forward overfitting guard** + XAI audit trail
            - **Kill switch**, circuit breakers, governance guardrails

            ### Verify Downloads
            Compare SHA-256 hashes from `checksums.txt`:
            ```bash
            sha256sum -c checksums.txt
            ```
          files: |
            artifacts/*
            install.sh
            install.ps1
          prerelease: false
          make_latest: true
